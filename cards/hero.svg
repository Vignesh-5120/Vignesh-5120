
<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280">
      <stop stop-color="#080B14"/>
      <stop offset="1" stop-color="#111C35"/>
    </linearGradient>
    <linearGradient id="blue" x1="100" y1="0" x2="800" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="276" rx="22" stroke="#263B65"/>

  <circle cx="760" cy="70" r="130" fill="#2563EB" opacity=".10">
    <animate attributeName="opacity" values=".05;.22;.05" dur="4s" repeatCount="indefinite"/>
  </circle>

  <path d="M0 235 Q250 180 450 230 T900 190" stroke="url(#blue)" opacity=".3" stroke-width="2">
    <animate attributeName="d" values="M0 235 Q250 180 450 230 T900 190;M0 210 Q250 260 450 190 T900 220;M0 235 Q250 180 450 230 T900 190" dur="6s" repeatCount="indefinite"/>
  </path>

  <text x="65" y="65" fill="#60A5FA" font-family="monospace" font-size="14" letter-spacing="4">HELLO, WORLD</text>

  <text x="60" y="145" fill="white" font-family="Arial,sans-serif" font-size="66" font-weight="bold" letter-spacing="3">VIGNESH</text>

  <rect x="65" y="174" width="55" height="3" rx="2" fill="#38BDF8">
    <animate attributeName="width" values="55;150;55" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="65" y="215" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="19">AI &amp; MACHINE LEARNING</text>
  <text x="65" y="245" fill="#64748B" font-family="monospace" font-size="13">LEARNING • BUILDING • IMPROVING</text>

  <circle cx="820" cy="225" r="5" fill="#38BDF8">
    <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
