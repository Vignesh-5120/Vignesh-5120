
name: Update Animated GitHub Profile

on:
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:
    inputs:
      static_preview:
        description: "Generate static SVG preview"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-github-profile
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: Vignesh-5120

      - name: Generate SVG cards
        run: python scripts/render_readme_cards.py
        env:
          STATIC: ${{ inputs.static_preview && '1' || '0' }}

      - name: Commit updated cards and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json cards/activity.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update animated GitHub profile cards"
            git push
          else
            echo "No changes to commit."
          fi
